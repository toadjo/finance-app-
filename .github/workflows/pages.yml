name: Phone app (GitHub Pages)

# Publishes the web build so it can be installed on a phone's Home Screen.
# Only the app is published — your ledger never leaves your device.
on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A run already publishing is left to finish rather than
# cancelled: interrupting `deploy-pages` mid-flight leaves the Pages deployment
# half-claimed, and the run that follows it fails on a state it didn't create.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Pages serves from /<repo>/, so asset URLs need that prefix.
      - name: Build for Pages
        run: npx vite build --base=/finance-app-/

      # Pages has no SPA fallback; a copy of index.html answers any stray path.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
